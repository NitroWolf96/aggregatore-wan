name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Unit tests (race)
        run: go test -race ./...
      - name: Fuzz smoke
        run: |
          go test ./internal/wire -fuzz FuzzParseDataHeader -fuzztime 10s
          go test ./internal/wire -fuzz FuzzParseHeader -fuzztime 5s
          go test ./internal/wire -fuzz FuzzMACVerify -fuzztime 5s

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build amd64
        run: make build
      - name: Cross-build arm64
        run: make build-arm64

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iperf3 iproute2
      - name: M1 single-path tunnel
        run: sudo test/netns/run_m1.sh
      - name: M2 striping
        run: sudo test/netns/run_m2.sh
      - name: M3 failover + recovery
        run: sudo test/netns/run_m3.sh
      - name: M4 realtime duplication
        run: sudo test/netns/run_m4.sh
      - name: M5 FEC
        run: sudo test/netns/run_m5.sh
