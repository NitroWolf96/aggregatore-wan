name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Lint
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
      - name: Unit tests (race)
        run: go test -race ./...
      - name: Fuzz smoke
        run: |
          go test ./internal/wire -fuzz FuzzParseDataHeader -fuzztime 10s
          go test ./internal/wire -fuzz FuzzParseHeader -fuzztime 5s
          go test ./internal/wire -fuzz FuzzMACVerify -fuzztime 5s

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build amd64
        run: make build
      - name: Cross-build arm64
        run: make build-arm64
