name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            for bin in treccia-client treccia-server; do
              GOOS=linux GOARCH=$arch CGO_ENABLED=0 \
                go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
                -o "dist/${bin}-linux-${arch}" "./cmd/${bin}"
            done
          done
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/treccia:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/treccia:latest
